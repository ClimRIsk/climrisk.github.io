version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
#  ClimRisk.io — Production Backend
#  Distributed microservices for geospatial hazard scoring, parametric triggers,
#  and CSRD/ESRS E1 regulatory reporting.
#
#  Services:
#    infrastructure  → Kafka · Zookeeper · PostGIS · TimescaleDB · MongoDB · Redis
#    hazard_engine   → FastAPI + GeoPandas + PostGIS (geospatial hazard scoring)
#    parametric      → FastAPI + Kafka consumer + TimescaleDB (live trigger engine)
#    csrd_service    → FastAPI + MongoDB (ESRS E1 VaR + XBRL reporting)
#    asset_service   → FastAPI + PostGIS (asset CRUD + coordinate validation)
#    gateway         → NGINX (TLS termination + routing)
# ══════════════════════════════════════════════════════════════════════════════

networks:
  climrisk-net:
    driver: bridge

volumes:
  postgres_data:
  timescale_data:
  mongo_data:
  kafka_data:
  zk_data:
  redis_data:

# ── Infrastructure ───────────────────────────────────────────────────────────
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: climrisk-zookeeper
    networks: [climrisk-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: climrisk-kafka
    networks: [climrisk-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      # Exactly-once semantics for parametric triggers
      KAFKA_ENABLE_IDEMPOTENCE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: climrisk-kafka-init
    networks: [climrisk-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.assets.registered --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.asset.validated --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.hazard.intersected --partitions 8 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.weather.telemetry.live --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.parametric.trigger.fired --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.reporting.csrd.job_complete --partitions 2 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.report.csrd_e1_ready --partitions 2 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic climrisk.dlq --partitions 2 --replication-factor 1
      echo 'Topics created.'
      "

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: climrisk-schema-registry
    networks: [climrisk-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  # PostGIS — geospatial asset + hazard layer storage
  postgis:
    image: postgis/postgis:16-3.4
    container_name: climrisk-postgis
    networks: [climrisk-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: climrisk
      POSTGRES_USER: ${POSTGRES_USER:-climrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climrisk_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-climrisk} -d climrisk"]
      interval: 10s
      timeout: 5s
      retries: 10

  # TimescaleDB — time-series weather telemetry + trigger audit trail
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: climrisk-timescaledb
    networks: [climrisk-net]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: climrisk_ts
      POSTGRES_USER: ${TIMESCALE_USER:-climrisk}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-climrisk_ts_secret}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-climrisk}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MongoDB — CSRD report state + XBRL document store
  mongodb:
    image: mongo:7.0
    container_name: climrisk-mongodb
    networks: [climrisk-net]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-climrisk}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-climrisk_mongo_secret}
      MONGO_INITDB_DATABASE: climrisk_reports
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis — response caching + rate limiting
  redis:
    image: redis:7.2-alpine
    container_name: climrisk-redis
    networks: [climrisk-net]
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-climrisk_redis} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application Services ─────────────────────────────────────────────────

  asset_service:
    build:
      context: ./asset_service
      dockerfile: Dockerfile
    container_name: climrisk-asset-service
    networks: [climrisk-net]
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-climrisk}:${POSTGRES_PASSWORD:-climrisk_secret}@postgis:5432/climrisk
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD:-climrisk_redis}@redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hazard_engine:
    build:
      context: ./hazard_engine
      dockerfile: Dockerfile
    container_name: climrisk-hazard-engine
    networks: [climrisk-net]
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-climrisk}:${POSTGRES_PASSWORD:-climrisk_secret}@postgis:5432/climrisk
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD:-climrisk_redis}@redis:6379/1
      HAZARD_LAYERS_PATH: /data/hazard_layers
      BATCH_CONCURRENCY: "4"
      LOG_LEVEL: INFO
    volumes:
      - ./data/hazard_layers:/data/hazard_layers:ro  # GeoTIFF / NetCDF files
    depends_on:
      postgis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  parametric_engine:
    build:
      context: ./parametric_engine
      dockerfile: Dockerfile
    container_name: climrisk-parametric-engine
    networks: [climrisk-net]
    ports:
      - "8003:8000"
    environment:
      TIMESCALE_URL: postgresql+asyncpg://${TIMESCALE_USER:-climrisk}:${TIMESCALE_PASSWORD:-climrisk_ts_secret}@timescaledb:5432/climrisk_ts
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_GROUP_ID: parametric-engine-group
      REDIS_URL: redis://:${REDIS_PASSWORD:-climrisk_redis}@redis:6379/2
      LOG_LEVEL: INFO
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  csrd_service:
    build:
      context: ./csrd_service
      dockerfile: Dockerfile
    container_name: climrisk-csrd-service
    networks: [climrisk-net]
    ports:
      - "8004:8000"
    environment:
      MONGO_URL: mongodb://${MONGO_USER:-climrisk}:${MONGO_PASSWORD:-climrisk_mongo_secret}@mongodb:27017/climrisk_reports?authSource=admin
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_GROUP_ID: csrd-service-group
      REDIS_URL: redis://:${REDIS_PASSWORD:-climrisk_redis}@redis:6379/3
      LOG_LEVEL: INFO
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── API Gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: climrisk-gateway
    networks: [climrisk-net]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - asset_service
      - hazard_engine
      - parametric_engine
      - csrd_service
    restart: unless-stopped
