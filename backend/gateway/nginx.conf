##
## ClimRisk API Gateway — nginx.conf
##
## Routes:
##   /api/v1/assets/*       → asset_service:8001
##   /api/v1/hazard/*       → hazard_engine:8002
##   /api/v1/parametric/*   → parametric_engine:8003
##   /api/v1/reports/*      → csrd_service:8004
##   /health                → gateway health check
##

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types text/plain application/json application/octet-stream;

    # ── Rate limiting ───────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;

    # ── Upstream definitions ────────────────────────────────────────────────────
    upstream asset_service {
        server asset_service:8001;
        keepalive 8;
    }

    upstream hazard_engine {
        server hazard_engine:8002;
        keepalive 8;
    }

    upstream parametric_engine {
        server parametric_engine:8003;
        keepalive 8;
    }

    upstream csrd_service {
        server csrd_service:8004;
        keepalive 8;
    }

    # ── Shared proxy headers ────────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;

    # ── Main server block ───────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Gateway health check (no upstream needed)
        location = /health {
            access_log off;
            return 200 '{"status":"ok","gateway":"climrisk-nginx"}';
            add_header Content-Type application/json;
        }

        # ── Asset Service ───────────────────────────────────────────────────────
        location /api/v1/assets/upload/ {
            limit_req zone=upload_limit burst=2 nodelay;
            client_max_body_size 50M;
            proxy_pass http://asset_service/assets/upload/;
        }

        location /api/v1/assets {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://asset_service/assets;
        }

        # ── Hazard Engine ───────────────────────────────────────────────────────
        location /api/v1/hazard/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://hazard_engine/;
            proxy_read_timeout 300s;   # batch scoring may be slow
        }

        # ── Parametric Engine ───────────────────────────────────────────────────
        location /api/v1/parametric/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://parametric_engine/;
        }

        # ── CSRD Service ────────────────────────────────────────────────────────
        location /api/v1/reports/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://csrd_service/reports/;
            proxy_read_timeout 300s;   # PDF generation may take time
        }

        # ── Passthrough service health checks ───────────────────────────────────
        location /api/v1/assets/health   { proxy_pass http://asset_service/health; }
        location /api/v1/hazard/health   { proxy_pass http://hazard_engine/health; }
        location /api/v1/parametric/health { proxy_pass http://parametric_engine/health; }
        location /api/v1/reports/health  { proxy_pass http://csrd_service/health; }

        # ── OpenAPI docs (dev only — strip in prod) ─────────────────────────────
        location /docs/assets   { proxy_pass http://asset_service/docs; }
        location /docs/hazard   { proxy_pass http://hazard_engine/docs; }
        location /docs/parametric { proxy_pass http://parametric_engine/docs; }
        location /docs/reports  { proxy_pass http://csrd_service/docs; }

        # Block all other paths
        location / {
            return 404 '{"error":"endpoint not found"}';
            add_header Content-Type application/json;
        }
    }

    # ── HTTPS server (TLS termination — use with real certs in prod) ────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name api.climrisk.io;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     include /etc/nginx/conf.d/api_locations.conf;
    # }
}
