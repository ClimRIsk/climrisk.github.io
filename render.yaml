services:
  - type: web
    name: climrisk-engine
    runtime: python
    plan: free
    buildCommand: pip install "./climate_risk_engine[api]"
    startCommand: uvicorn cri.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CRI_CACHE_DIR
        value: /tmp/cri_cache
    healthCheckPath: /health
    autoDeploy: true
