services:
  - type: web
    name: climrisk-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps -e ./climate_risk_engine
    startCommand: pip install python-multipart --quiet && uvicorn cri.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: CRI_CACHE_DIR
        value: /tmp/cri_cache
      - key: RESEND_API_KEY
        sync: false
      - key: INQUIRY_NOTIFY_EMAIL
        value: shri@climrisk.io
      - key: INQUIRY_FROM_EMAIL
        value: onboarding@resend.dev
    healthCheckPath: /health
    autoDeploy: true
