services:
  - type: web
    name: climrisk-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps -e ./climate_risk_engine
    startCommand: uvicorn cri.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: CRI_CACHE_DIR
        value: /tmp/cri_cache
    healthCheckPath: /health
    autoDeploy: true
